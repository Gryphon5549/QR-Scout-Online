name: Build desktop apps

# Builds the Electron desktop shells for every platform and attaches the
# installers to a GitHub Release when a v* tag is pushed. The site's App tab
# links to releases/latest/download/<stable-name>, so file names must stay
# stable (see artifactName in app/electron-builder.yml).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Linux packaging prerequisites
        if: runner.os == 'Linux'
        # ubuntu-24.04 runners ship without FUSE, which the AppImage
        # tooling (linuxdeploy/appimagetool) normally needs to mount.
        run: sudo apt-get update && sudo apt-get install -y libfuse2t64

      - name: Build installers
        env:
          # No signing certificates in this repo — skip macOS signing lookups.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Without FUSE, AppImage tools must extract-and-run instead of mount.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          case "${{ runner.os }}" in
            Windows) npx electron-builder --win nsis --x64 --arm64 2>&1 | tee build.log ;;
            macOS)   npx electron-builder --mac dmg zip --x64 --arm64 2>&1 | tee build.log ;;
            Linux)   npx electron-builder --linux AppImage deb --x64 --arm64 2>&1 | tee build.log ;;
          esac

      - name: Normalize Linux artifact names
        if: runner.os == 'Linux'
        # electron-builder names Linux x64 artifacts x86_64 (Debian style) and
        # amd64 (deb). The site's download links use stable x64 names.
        # Node-based rename from GITHUB_WORKSPACE (absolute paths, no shell
        # globbing/sed) so the step cannot fail on the runner's tooling.
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const root = process.env.GITHUB_WORKSPACE;
            const dir = path.join(root, "dist-app");
            for (const entry of fs.readdirSync(dir)) {
              const m = entry.match(/^QRScout-linux-(x86_64|amd64)\.(AppImage|deb)$/);
              if (m) {
                const target = `QRScout-linux-x64${m[2]}`;
                fs.renameSync(path.join(dir, entry), path.join(dir, target));
                console.log(`renamed ${entry} -> ${target}`);
              }
            }
          '

      - name: Publish build log to ci-debug branch (on failure)
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" debug-repo
          mkdir -p debug-repo/ci-logs
          cp build.log "debug-repo/ci-logs/${RUNNER_OS}-build.log" 2>/dev/null || echo "no build.log" > "debug-repo/ci-logs/${RUNNER_OS}-build.log"
          cd debug-repo
          git config user.name "ci-debug-bot"
          git config user.email "ci-debug-bot@users.noreply.github.com"
          git add ci-logs
          git commit -m "ci logs: ${RUNNER_OS} run ${GITHUB_RUN_ID}" --allow-empty
          git push origin HEAD:ci-debug

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apps-${{ runner.os }}
          path: |
            dist-app/*.exe
            dist-app/*.dmg
            dist-app/*.zip
            dist-app/*.AppImage
            dist-app/*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release with installers
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true